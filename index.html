 tagline:'Fast checkout, live stock, cashiers and a full SME ledger — all on the shop’s own computer.',
 auth:'credentials',
 authenticate(username,password){
  if(!username||!password)return null;
  if(username===OWNER_ACCOUNT.username&&password===OWNER_ACCOUNT.password)return{name:OWNER_ACCOUNT.name,role:'Owner'};
  const c=T('cashiers').find(c=>c.username===username&&c.password===password);
  if(c&&c.status==='active')return{name:c.name,role:'Cashier',storeId:c.storeId};
  return null;
 },
 roleHome:{Cashier:'till'},
 nav:[
  {id:'till',label:'Cashier',icon:'cart'},
  {id:'inventory',label:'Admin Inventory',icon:'box',roles:['Owner']},
  {id:'cashiers',label:'Cashiers',icon:'users',roles:['Owner']},
  {id:'ledger',label:'SME Ledger',icon:'chart',roles:['Owner']}
 ],

 seed(K){
  const STORES=[{id:'st1',name:'Sample Supermarket'},{id:'st2',name:'Branch 2'},{id:'st3',name:'Branch 3'}];
  // Real, live migration: her actual 592-item catalogue, all currently at her one real
  // location (Ritpack Supermarket / st1). Branch 2 and Branch 3 are separate, empty
  // inventories reserved for future locations — a product created under one branch
  // never appears in another; each branch's stock and catalogue stand on their own.
  const products=SAMPLE_STOCK.map((p,i)=>({id:'p'+(i+1),sku:'RS-'+pad(i+1,4),barcode:p[0],name:p[1],category:p[2],
   cost:p[3],price:p[4],reorder:3,stock:p[5],storeId:'st1'}));

  // No customers, suppliers, sales history or expenses are invented — these start empty
  // and will fill in naturally as Ritpack Supermarket starts using the system.
  const customers=[];
  const suppliers=[];
  const sales=[];
  const stockMoves=[];
  const supplies=[];
  const creditInvoices=[];
  const creditPayments=[];
  const supplierPayments=[];
  const expenses=[];

  // Her two real, existing accounts carry over as-is so nobody has to re-learn a login.
  const cashiers=[{id:'cs1',name:'Vera',username:'Vera',password:'Vera@Sample',status:'active',storeId:'st1'}];

  return{products,customers,suppliers,sales,cashiers,stockMoves,supplies,creditInvoices,creditPayments,supplierPayments,expenses,stores:STORES};
 },

 views:{
  till(el){
   const u=K.user();
   const lockedToStore=u&&u.role==='Cashier'&&u.storeId;
   K.till(el,{items:'products',sales:'sales',prefix:'S-',noun:'products',saleNoun:'sale',methods:['Cash','Mobile Money','Card','Credit'],showRecent:true,hideUntilSearch:true,noCategories:true,qtyPrompt:true,
    catOf:p=>p.category,info:p=>({sub:p.sku}),
    filter:p=>p.storeId===activeStoreId(),
    storeField:lockedToStore?null:{opts:()=>T('stores').map(s=>({v:s.id,l:s.name})),value:activeStoreId,onChange:v=>{K.setting('activeStore',v);}},
    storeLabel:lockedToStore?storeOf(u.storeId).name:null,
    fields:[{k:'customer',l:'Customer',t:'select',opts:()=>[{v:'',l:'Walk-in customer'}].concat(custOpts())},{k:'phone',l:'SMS receipt to (optional)',t:'tel',ph:'0240000000'}],
    validate:(cart,v,m)=>m==='Credit'&&!v.customer?'Choose a customer for a credit sale':null,
    completeActions:[
     {l:'Print & Complete',cls:'pri',autoPrint:true},
     {l:'Send SMS & Complete',cls:'ok',require:'phone',requireMsg:'Enter a phone number to send the SMS receipt'},
     {l:'Issue Credit Invoice',method:'Credit',style:'background:#7c3aed;color:#fff;border-color:#7c3aed'}
    ],
    onSale:s=>{
     s.storeId=activeStoreId();
     if(s.method==='Credit'){const c=get('customers',s.customer);if(c){c.balance=r2(c.balance+s.total);}}
     K.save();
     if(s.phone)K.sms(s.phone,K.receiptText(receipt(s)),'Receipt');
    },
    receipt});
  },

  inventory(el){
   const curStore=()=>activeStoreId();
   const storeProducts=()=>T('products').filter(p=>p.storeId===curStore());
   el.innerHTML='<div class="bar"><select id="invstoresel" style="max-width:220px">'+T('stores').map(s=>'<option value="'+esc(s.id)+'"'+(s.id===curStore()?' selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select>'+
    '<button class="btn pri" data-act="add">+ Create product</button><button class="btn" data-act="recv">Record received supply</button><button class="btn" data-act="stores">Manage stores</button><span class="sp"></span></div>'+
    '<p class="muted small" style="margin:6px 2px 0" id="invnote"></p><div id="invtabs" style="margin:10px 0"></div><div id="invbody"></div>';
   const st={tab:0};
   const TABS=['Current inventory','Received supply & history'];
   const drawTabs=()=>{el.querySelector('#invtabs').innerHTML=K.chips(TABS,st.tab,'tab');};
   const drawNote=()=>{el.querySelector('#invnote').textContent='Showing '+storeOf(curStore()).name+'’s own inventory — each branch keeps a separate stock list and catalogue.';};

   const productForm=(row)=>K.formModal({title:(row?'Edit ':'Create ')+'product — '+storeOf(curStore()).name,fields:[
     {k:'name',l:'Product name',req:1,w:'full'},{k:'barcode',l:'Barcode (optional)'},{k:'category',l:'Category',t:'select',opts:CATS,req:1},
     {k:'price',l:'Selling price (GH₵)',t:'number',step:'0.01',req:1},{k:'cost',l:'Cost price (GH₵)',t:'number',step:'0.01',req:1},
     {k:'stock',l:row?'Stock':'Opening stock',t:'number',min:0,def:0,req:1},
     {k:'reorder',l:'Reorder level',t:'number',def:3,hint:'Shows as low stock at or below this number.'}],
    values:row||{},
    onSave:v=>{
     if(row){upd('products',row.id,v);K.log('Updated product: '+v.name);}
     else{v.sku=K.code('RS-','products','sku');v.storeId=curStore();add('products',v);K.log('New product: '+v.name+' — '+storeOf(curStore()).name);}
     K.save();K.toast('Saved','ok');paintBody();
    }});

   const pickProductField=()=>({k:'productId',l:'Product',t:'pick',opts:()=>storeProducts().map(p=>({v:p.id,l:p.name+' ('+p.sku+')'})),req:1,w:'full'});

   const openRecv=()=>K.formModal({title:'Record received supply — '+storeOf(curStore()).name,fields:[
     pickProductField(),{k:'supplierId',l:'Supplier',t:'select',opts:suppOpts,req:1},{k:'reference',l:'Reference (optional)'},
     {k:'qty',l:'Quantity received',t:'number',min:1,req:1},{k:'cost',l:'Cost price per unit (GH₵)',t:'number',step:'0.01',req:1}],
    onSave:v=>{
     const p=get('products',v.productId);if(!p||p.storeId!==curStore()){K.toast('Choose a product from this store','bad');return false;}
     p.stock=(p.stock||0)+Number(v.qty);p.cost=Number(v.cost);K.save();
     add('stockMoves',{date:today(),storeId:curStore(),productId:p.id,name:p.name,qty:Number(v.qty),note:'From '+suppOf(v.supplierId).name+(v.reference?' — '+v.reference:'')});
     const n=T('supplies').length+1;add('supplies',{ref:'GR-'+pad(n,4),storeId:curStore(),supplierId:v.supplierId,reference:v.reference,date:today(),items:[{productId:p.id,name:p.name,qty:Number(v.qty),cost:Number(v.cost)}],total:r2(v.qty*v.cost)});
     K.log('Received '+v.qty+' × '+p.name+' — '+storeOf(curStore()).name);K.toast('Stock updated','ok');paintBody();
    }});
   const openStores=()=>K.modal({title:'Manage stores',body:'<p class="muted small" style="margin:0 0 10px">Renaming a store does not move or merge its inventory — each keeps its own separate product list.</p>'+T('stores').map(s=>'<label class="fld full" style="margin-bottom:10px"><span>Store name</span><input data-store="'+s.id+'" value="'+esc(s.name)+'"></label>').join(''),
    buttons:[{l:'Cancel'},{l:'Save',cls:'pri',fn:w=>{
     w.querySelectorAll('[data-store]').forEach(inp=>{const s=get('stores',inp.dataset.store);if(s&&inp.value.trim())s.name=inp.value.trim();});
     K.save();K.log('Renamed stores');K.toast('Stores updated','ok');paintBody();drawNote();
     const sel=el.querySelector('#invstoresel');if(sel)sel.innerHTML=T('stores').map(s=>'<option value="'+esc(s.id)+'"'+(s.id===curStore()?' selected':'')+'>'+esc(s.name)+'</option>').join('');
    }}]});

   const paintBody=()=>{
    const body=el.querySelector('#invbody');
    if(st.tab===0){
     body.innerHTML='<div class="card tc" id="invtab0"></div>';
     K.crud(body.querySelector('#invtab0'),{table:'products',noun:'product',noAdd:true,search:['name','sku','barcode','category'],searchPh:'Search '+storeOf(curStore()).name+'’s inventory…',sort:(a,b)=>a.name.localeCompare(b.name),
      filter:p=>p.storeId===curStore(),
      chips:[{l:'All'},{l:'Low stock',fn:p=>p.stock>0&&p.stock<=p.reorder},{l:'Out of stock',fn:p=>p.stock<=0}],
      cols:[{l:'Product',f:p=>'<b>'+esc(p.name)+'</b><span class="sub2">'+esc(p.sku)+(p.barcode?' · '+esc(p.barcode):'')+'</span>'},{l:'Category',k:'category'},
       {l:'Cost',cls:'num',f:p=>money(p.cost)},{l:'Sell',cls:'num',f:p=>money(p.price)},{l:'Profit',cls:'num',f:p=>pl(r2(p.price-p.cost))},
       {l:'Stock',f:stockBadge}],
      fields:(row)=>[{k:'name',l:'Product name',req:1,w:'full'},{k:'barcode',l:'Barcode (optional)'},{k:'category',l:'Category',t:'select',opts:CATS,req:1},
       {k:'price',l:'Selling price (GH₵)',t:'number',step:'0.01',req:1},{k:'cost',l:'Cost price (GH₵)',t:'number',step:'0.01',req:1},{k:'stock',l:'Stock',t:'number',min:0,req:1},{k:'reorder',l:'Reorder level',t:'number',req:1}],
      actions:[{a:'recv',l:'Receive',fn:p=>K.formModal({title:'Received supply — '+p.name,fields:[{k:'supplierId',l:'Supplier',t:'select',opts:suppOpts,req:1},{k:'reference',l:'Reference (optional)'},{k:'qty',l:'Quantity',t:'number',min:1,req:1},{k:'cost',l:'Cost per unit (GH₵)',t:'number',step:'0.01',req:1,def:p.cost}],
        onSave:v=>{p.stock=(p.stock||0)+Number(v.qty);p.cost=Number(v.cost);K.save();
         add('stockMoves',{date:today(),storeId:curStore(),productId:p.id,name:p.name,qty:Number(v.qty),note:'From '+suppOf(v.supplierId).name});
         const n=T('supplies').length+1;add('supplies',{ref:'GR-'+pad(n,4),storeId:curStore(),supplierId:v.supplierId,reference:v.reference,date:today(),items:[{productId:p.id,name:p.name,qty:Number(v.qty),cost:Number(v.cost)}],total:r2(v.qty*v.cost)});
         K.toast('Stock updated','ok');paintBody();}})}]});
    }else{
     const moves=T('stockMoves').filter(m=>m.storeId===curStore());
     body.innerHTML='<div class="card" style="margin-bottom:16px"><h3>Recent stock movements — '+esc(storeOf(curStore()).name)+'</h3><div id="mvlist"></div></div>'+
      '<div class="card" id="mvhist"></div>';
     body.querySelector('#mvlist').innerHTML=K.list(moves.slice(-6).reverse().map(m=>({t:m.name,s:'Received · '+m.note,r:m.qty+' units'})),'No movements yet');
     K.crud(body.querySelector('#mvhist'),{table:'stockMoves',noun:'movement',noAdd:true,noEdit:true,noDelete:true,search:['name','note'],searchPh:'Search history…',range:{key:'date',def:'month'},sort:(a,b)=>b.date.localeCompare(a.date),
      filter:m=>m.storeId===curStore(),
      cols:[{l:'Date',f:m=>fmtDate(m.date)},{l:'Product',k:'name'},{l:'Received',cls:'num',k:'qty'},{l:'Note',k:'note'}]});
    }
   };
   drawTabs();drawNote();paintBody();
   el.querySelector('#invtabs').onclick=e=>{const b=e.target.closest('[data-act=tab]');if(b){st.tab=+b.dataset.id;drawTabs();paintBody();}};
   el.querySelector('.bar').onclick=e=>{if(e.target.closest('[data-act=add]'))productForm(null);else if(e.target.closest('[data-act=recv]'))openRecv();else if(e.target.closest('[data-act=stores]'))openStores();};
   el.querySelector('#invstoresel').onchange=e=>{K.setting('activeStore',e.target.value);drawNote();paintBody();};
  },

  cashiers(el){
   K.crud(el,{table:'cashiers',noun:'cashier',addLabel:'Create cashier',search:['name','username'],sort:(a,b)=>a.name.localeCompare(b.name),
    cols:[{l:'Name',k:'name'},{l:'Username',f:c=>'<code>'+esc(c.username)+'</code>'},{l:'Store',f:c=>storeOf(c.storeId).name},{l:'Status',f:c=>badge(c.status==='active'?'Active':'Suspended',c.status==='active'?'ok':'mute')}],
    fields:(row)=>[{k:'name',l:'Cashier full name',req:1,w:'full'},{k:'username',l:'Staff username (used to log in)',req:1},
     {k:'storeId',l:'Assigned store',t:'select',opts:()=>T('stores').map(s=>({v:s.id,l:s.name})),blank:false,hint:'The Till will show and sell only this store’s own inventory while she is signed in.'},
     {k:'newPassword',l:row?'New password (leave blank to keep the current one)':'Set a password',t:'password',hint:row?'Blank by default so it never shows an existing password on screen. Only fill this in if you want to change it.':'Tell the cashier this password — it will not be shown on screen again after you save.'},
     {k:'status',l:'Status',t:'select',opts:[{v:'active',l:'Active'},{v:'suspended',l:'Suspended'}],blank:false}],
    defaults:()=>({status:'active'}),
    validate:(v,row)=>{
     if(v.username&&T('cashiers').some(c=>c.username.toLowerCase()===v.username.toLowerCase()&&(!row||c.id!==row.id)))return 'That username is already taken';
     if(!row&&!v.newPassword)return 'Set a password for this cashier';
     if(v.newPassword&&v.newPassword.length<6)return 'Password should be at least 6 characters';
     return null;
    },
    before:(v,row)=>{v.password=v.newPassword?v.newPassword:(row?row.password:'');delete v.newPassword;return v;},
    actions:[{a:'tog',l:'Suspend / Activate',fn:(c,paint)=>{c.status=c.status==='active'?'suspended':'active';K.save();K.log((c.status==='active'?'Activated':'Suspended')+' cashier '+c.name);paint();}}]});
  },

  ledger(el){
   el.innerHTML='<h3 style="margin:0 0 10px">SME Financial Tracker</h3><div id="ltabs"></div><div id="lbody" style="margin-top:12px"></div>';
   const st={tab:0,from:addDays(today(),-6),to:today()};
   const TABS=['Sales history','Profit report','Credit sales','Credit payments','Supplier invoices','Supplier payments','Income statement','Void / return sale'];
   const drawTabs=()=>{el.querySelector('#ltabs').innerHTML=K.chips(TABS,st.tab,'tab');};
   const inRange=s=>s.date>=st.from&&s.date<=st.to;
   const dateBar=()=>'<div class="bar" style="margin-bottom:12px"><label class="fld"><span>Start date</span><input type="date" id="lf_from" value="'+st.from+'"></label><label class="fld"><span>End date</span><input type="date" id="lf_to" value="'+st.to+'"></label><span class="sp"></span><button class="btn pri" data-act="extract">Extract</button></div>';

   const paint=()=>{
    const body=el.querySelector('#lbody');
    if(st.tab===0){
     const rows=T('sales').filter(inRange).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
     body.innerHTML=dateBar()+'<div class="card tc">'+K.table([
      {l:'Receipt',f:s=>'<b>'+esc(s.ref)+'</b><span class="sub2">'+fmtDate(s.date)+' '+esc(s.time)+'</span>'},
      {l:'Items',f:s=>esc(s.items.map(i=>i.qty+' × '+i.name).join(', ').slice(0,60))},{l:'Cashier',k:'cashier'},{l:'Branch',f:s=>storeOf(s.storeId).name},
      {l:'Payment',f:s=>badge(s.method,s.method==='Credit'?'warn':'mute')},{l:'Total',cls:'num',f:s=>money(s.total)},
      {l:'Status',f:s=>s.voided?badge('Voided','bad'):badge('Completed','ok')}
     ],rows,{empty:'No sales in this range'})+'</div>'+
      '<div class="card" style="margin-top:12px">'+K.strip([['Sales',money(sum(rows.filter(s=>!s.voided),s=>s.total))],['Transactions',rows.filter(s=>!s.voided).length],['Average sale',money(rows.length?sum(rows.filter(s=>!s.voided),s=>s.total)/Math.max(1,rows.filter(s=>!s.voided).length):0)]])+'</div>';
    }else if(st.tab===1){
     const rows=T('sales').filter(inRange).filter(s=>!s.voided);
     const rev=sum(rows,s=>s.total);
     const cogs=sum(rows,s=>sum(s.items,i=>{const p=get('products',i.id);return(p?p.cost:0)*i.qty;}));
     const profit=r2(rev-cogs);
     const qty={};rows.forEach(s=>s.items.forEach(i=>{qty[i.name]=(qty[i.name]||0)+i.qty;}));
     const top=Object.keys(qty).sort((a,b)=>qty[b]-qty[a]).slice(0,8).map(n=>({t:n,s:qty[n]+' units sold',r:''}));
     const marginPct=rev?Math.round(profit/rev*100):0;
     body.innerHTML=dateBar()+'<div class="card">'+K.strip([['Revenue',money(rev)],['Cost of goods sold',out(cogs),'raw'],['Gross profit',pl(profit),'raw'],['Margin','<span style="color:'+(marginPct<0?'var(--bad)':'var(--ok)')+';font-weight:700">'+marginPct+'%</span>','raw']])+'</div>'+
      '<div class="card" style="margin-top:12px"><h3>Top sellers in range</h3>'+K.list(top,'No sales in this range')+'</div>';
    }else if(st.tab===2){
     const rows=T('customers').filter(c=>c.balance>0).sort((a,b)=>b.balance-a.balance);
     body.innerHTML='<div class="bar"><span class="sp"></span><button class="btn pri" data-act="newinv">Issue new credit invoice</button></div>'+
      '<div class="card tc">'+K.table([{l:'Customer',f:c=>'<b>'+esc(c.name)+'</b><span class="sub2">'+esc(c.phone)+'</span>'},{l:'Owes',cls:'num',f:c=>badge(money(c.balance),'warn')}],rows,{empty:'No outstanding credit sales'})+'</div>'+
      '<div class="card" style="margin-top:12px"><h3>Credit invoices issued</h3>'+K.table([{l:'Ref',k:'ref'},{l:'Customer',f:i=>custOf(i.customerId).name},{l:'Date',f:i=>fmtDate(i.date)},{l:'Note',k:'note'},{l:'Amount',cls:'num',f:i=>money(i.amount)}],T('creditInvoices').slice().reverse(),{empty:'None yet'})+'</div>';
    }else if(st.tab===3){
     const owing=T('customers').filter(c=>c.balance>0);
     body.innerHTML='<div class="bar"><span class="sp"></span><button class="btn pri" data-act="recvpay">Receive credit payment</button></div>'+
      '<div class="card tc">'+K.table([{l:'Date',f:p=>fmtDate(p.date)},{l:'Customer',f:p=>custOf(p.customerId).name},{l:'Method',k:'method'},{l:'Amount',cls:'num',f:p=>money(p.amount)}],T('creditPayments').slice().reverse(),{empty:'No credit payments recorded'})+'</div>'+
      (owing.length?'':'<p class="muted small" style="margin-top:8px">No customers currently owe a balance.</p>');
    }else if(st.tab===4){
     body.innerHTML='<div class="bar"><span class="sp"></span><button class="btn pri" data-act="newsinv">Record supplier invoice</button></div>'+
      '<div class="card tc">'+K.table([{l:'Ref',k:'ref'},{l:'Supplier',f:s=>suppOf(s.supplierId).name},{l:'Reference',k:'reference'},{l:'Date',f:s=>fmtDate(s.date)},{l:'Amount',cls:'num',f:s=>out(s.total)}],T('supplies').slice().reverse(),{empty:'No supplier invoices yet'})+'</div>'+
      '<div class="card" style="margin-top:12px"><h3>Outstanding payables</h3>'+K.table([{l:'Supplier',k:'name'},{l:'Phone',k:'phone'},{l:'Owed',cls:'num',f:s=>s.balance>0?badge(money(s.balance),'warn'):badge('Settled','ok')}],T('suppliers'),{empty:'No suppliers yet'})+'</div>';
    }else if(st.tab===5){
     body.innerHTML='<div class="bar"><span class="sp"></span><button class="btn pri" data-act="paysupp">Pay a supplier</button></div>'+
      '<div class="card tc">'+K.table([{l:'Date',f:p=>fmtDate(p.date)},{l:'Supplier',f:p=>suppOf(p.supplierId).name},{l:'Method',k:'method'},{l:'Reference',k:'reference'},{l:'Amount',cls:'num',f:p=>out(p.amount)}],T('supplierPayments').slice().reverse(),{empty:'No supplier payments recorded'})+'</div>';
    }else if(st.tab===6){
     const rows=T('sales').filter(inRange).filter(s=>!s.voided);
     const rev=sum(rows,s=>s.total);
     const cogs=sum(rows,s=>sum(s.items,i=>{const p=get('products',i.id);return(p?p.cost:0)*i.qty;}));
     const gross=r2(rev-cogs);
     const exp=T('expenses').filter(inRange);
     const expTotal=sum(exp,e=>e.amount);
     const net=r2(gross-expTotal);
     body.innerHTML=dateBar()+'<div class="card"><h3>Income statement</h3>'+K.table([{l:'',k:'a'},{l:'',cls:'num',f:x=>x.b}],[
       {a:'Sales revenue',b:money(rev)},{a:'Cost of goods sold',b:'('+out(cogs)+')'},{a:'Gross profit',b:pl(gross)},{a:'Operating expenses',b:'('+out(expTotal)+')'},{a:'Net profit',b:pl(net)}
      ]).replace(/<thead>.*<\/thead>/,'')+'</div>'+
      '<div class="bar" style="margin-top:12px"><span class="sp"></span><button class="btn pri" data-act="newexp">Add expense</button></div>'+
      '<div class="card tc">'+K.table([{l:'Date',f:e=>fmtDate(e.date)},{l:'Category',k:'category'},{l:'Note',k:'note'},{l:'Amount',cls:'num',f:e=>out(e.amount)}],T('expenses').slice().reverse(),{empty:'No expenses logged'})+'</div>';
    }else{
     const cashierNames=Array.from(new Set(T('sales').map(s=>s.cashier).filter(Boolean))).sort();
     const f=st.voidFilter||{cashier:'',ref:'',date:''};
     let rows=T('sales').filter(s=>!s.voided);
     if(f.cashier)rows=rows.filter(s=>s.cashier===f.cashier);
     if(f.ref)rows=rows.filter(s=>s.ref.toLowerCase().includes(f.ref.toLowerCase()));
     if(f.date)rows=rows.filter(s=>s.date===f.date);
     rows=rows.sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).slice(0,60);
     body.innerHTML='<div class="bar" style="margin-bottom:12px">'+
      '<label class="fld"><span>Cashier</span><select id="vf_cashier"><option value="">All cashiers</option>'+cashierNames.map(n=>'<option value="'+esc(n)+'"'+(n===f.cashier?' selected':'')+'>'+esc(n)+'</option>').join('')+'</select></label>'+
      '<label class="fld"><span>Receipt / invoice number</span><input id="vf_ref" placeholder="e.g. S-0012" value="'+esc(f.ref)+'"></label>'+
      '<label class="fld"><span>Date</span><input type="date" id="vf_date" value="'+esc(f.date)+'"></label>'+
      '<span class="sp"></span><button class="btn pri" data-act="vfind">Find</button>'+(f.cashier||f.ref||f.date?'<button class="btn sm" data-act="vclear">Clear</button>':'')+'</div>'+
      '<div class="card tc">'+K.table([
      {l:'Receipt',f:s=>'<b>'+esc(s.ref)+'</b><span class="sub2">'+fmtDate(s.date)+' '+esc(s.time)+'</span>'},{l:'Cashier',k:'cashier'},{l:'Branch',f:s=>storeOf(s.storeId).name},{l:'Payment',f:s=>badge(s.method,s.method==='Credit'?'warn':'mute')},
      {l:'Total',cls:'num',f:s=>money(s.total)},{l:'',cls:'acts',f:s=>'<button class="btn sm bad" data-act="void" data-id="'+s.id+'">Void</button>'}
     ],rows,{empty:'No matching sales to void'})+'</div>';
    }
   };
   const bind=()=>{
    el.querySelector('#ltabs').onclick=e=>{const b=e.target.closest('[data-act=tab]');if(b){st.tab=+b.dataset.id;drawTabs();paint();bind();}};
    const body=el.querySelector('#lbody');
    body.onclick=e=>{
     if(e.target.closest('[data-act=extract]')){st.from=body.querySelector('#lf_from').value||st.from;st.to=body.querySelector('#lf_to').value||st.to;paint();bind();return;}
     if(e.target.closest('[data-act=newinv]'))return K.formModal({title:'Issue new credit invoice',fields:[{k:'customerId',l:'Customer',t:'select',opts:custOpts,req:1},{k:'amount',l:'Amount (GH₵)',t:'number',step:'0.01',req:1},{k:'note',l:'Note',w:'full'}],
      onSave:v=>{const c=get('customers',v.customerId);if(!c)return false;c.balance=r2(c.balance+Number(v.amount));K.save();const n=T('creditInvoices').length+1;add('creditInvoices',{ref:'CI-'+pad(n,4),customerId:v.customerId,amount:Number(v.amount),note:v.note,date:today()});
       if(c.phone)K.sms(c.phone,K.S.settings.org+': A credit invoice of '+money(v.amount)+' has been issued to you. Balance: '+money(c.balance)+'.','Credit',c.name);
       K.log('Credit invoice '+money(v.amount)+' — '+c.name);K.toast('Invoice issued','ok');paint();bind();}});
     if(e.target.closest('[data-act=recvpay]'))return K.formModal({title:'Receive credit payment',fields:[{k:'customerId',l:'Customer',t:'select',opts:()=>T('customers').filter(c=>c.balance>0).map(c=>({v:c.id,l:c.name+' — owes '+money(c.balance)})),req:1},{k:'amount',l:'Amount received (GH₵)',t:'number',step:'0.01',req:1},{k:'method',l:'Method',t:'select',opts:['Cash','Mobile Money','Card'],blank:false}],
      onSave:v=>{const c=get('customers',v.customerId);if(!c)return false;if(!(v.amount>0)||v.amount>c.balance+0.01){K.toast('Enter an amount up to '+money(c.balance),'bad');return false;}
       c.balance=r2(c.balance-Number(v.amount));K.save();add('creditPayments',{customerId:v.customerId,amount:Number(v.amount),date:today(),method:v.method});
       if(c.phone)K.sms(c.phone,K.S.settings.org+': Thank you. We received '+money(v.amount)+'. Your balance is now '+money(c.balance)+'.','Credit',c.name);
       K.log('Credit payment '+money(v.amount)+' — '+c.name);K.toast('Payment recorded','ok');paint();bind();}});
     if(e.target.closest('[data-act=newsinv]'))return K.formModal({title:'Record supplier invoice',fields:[{k:'supplierId',l:'Supplier',t:'select',opts:suppOpts,req:1},{k:'reference',l:'Reference (optional)'},{k:'amount',l:'Amount (GH₵)',t:'number',step:'0.01',req:1}],
      onSave:v=>{const s=get('suppliers',v.supplierId);if(!s)return false;s.balance=r2(s.balance+Number(v.amount));K.save();const n=T('supplies').length+1;
       add('supplies',{ref:'GR-'+pad(n,4),supplierId:v.supplierId,reference:v.reference,date:today(),items:[],total:Number(v.amount)});
       K.log('Supplier invoice '+money(v.amount)+' — '+s.name);K.toast('Invoice recorded','ok');paint();bind();}});
     if(e.target.closest('[data-act=paysupp]'))return K.formModal({title:'Pay a supplier',fields:[{k:'supplierId',l:'Supplier',t:'select',opts:()=>T('suppliers').filter(s=>s.balance>0).map(s=>({v:s.id,l:s.name+' — owed '+money(s.balance)})),req:1},{k:'amount',l:'Amount (GH₵)',t:'number',step:'0.01',req:1},{k:'method',l:'Method',t:'select',opts:['Cash','Mobile Money','Bank transfer'],blank:false},{k:'reference',l:'Reference (optional)'}],
      onSave:v=>{const s=get('suppliers',v.supplierId);if(!s)return false;if(!(v.amount>0)||v.amount>s.balance+0.01){K.toast('Enter an amount up to '+money(s.balance),'bad');return false;}
       s.balance=r2(s.balance-Number(v.amount));K.save();add('supplierPayments',{supplierId:v.supplierId,amount:Number(v.amount),date:today(),method:v.method,reference:v.reference});
       K.log('Paid supplier '+money(v.amount)+' — '+s.name);K.toast('Payment recorded','ok');paint();bind();}});
     if(e.target.closest('[data-act=newexp]'))return K.formModal({title:'Add expense',fields:[{k:'date',l:'Date',t:'date',req:1,def:today()},{k:'category',l:'Category',t:'select',opts:['Rent','Utilities','Transport','Salaries','Supplies','Other'],blank:false},{k:'amount',l:'Amount (GH₵)',t:'number',step:'0.01',req:1},{k:'note',l:'Note',w:'full'}],
      onSave:v=>{add('expenses',{date:v.date,category:v.category,amount:Number(v.amount),note:v.note});K.log('Expense '+money(v.amount)+' — '+v.category);K.toast('Expense recorded','ok');paint();bind();}});
     if(e.target.closest('[data-act=vfind]')){st.voidFilter={cashier:body.querySelector('#vf_cashier').value,ref:body.querySelector('#vf_ref').value.trim(),date:body.querySelector('#vf_date').value};paint();bind();return;}
     if(e.target.closest('[data-act=vclear]')){st.voidFilter=null;paint();bind();return;}
     const vb=e.target.closest('[data-act=void]');
     if(vb){const s=get('sales',vb.dataset.id);if(!s)return;
      K.confirm('Void sale '+s.ref+'? This restocks the items sold'+(s.method==='Credit'?' and reverses the credit balance':'')+'.','Void sale',()=>{
       s.items.forEach(i=>{const p=get('products',i.id);if(p)p.stock=(p.stock||0)+i.qty;});
       if(s.method==='Credit'&&s.customer){const c=get('customers',s.customer);if(c)c.balance=Math.max(0,r2(c.balance-s.total));}
       s.voided=true;K.save();K.log('Voided sale '+s.ref);K.toast('Sale voided','ok');paint();bind();
      },'bad');}
    };
   };
   drawTabs();paint();bind();
  }
 },

 dashboard(K){
  const S=T('sales').filter(s=>!s.voided),t=today(),wk=addDays(t,-6);
  const tod=S.filter(s=>s.date===t),week=S.filter(s=>s.date>=wk);
  const low=T('products').filter(p=>p.stock<=p.reorder);
  const qty={};week.forEach(s=>s.items.forEach(i=>{qty[i.name]=(qty[i.name]||0)+i.qty;}));
  const top=Object.keys(qty).sort((a,b)=>qty[b]-qty[a]).slice(0,5).map(n=>({t:n,s:'sold this week',r:qty[n]+' units'}));
  return{
   kpis:[{l:'Sales today',v:money(sum(tod,s=>s.total)),s:tod.length+' transactions',tone:'ok'},{l:'Sales this week',v:money(sum(week,s=>s.total)),s:week.length+' transactions'},
    {l:'Low or out of stock',v:low.length,s:'items to reorder (all branches)',tone:'warn'},{l:'Credit owed',v:money(sum(T('customers'),c=>c.balance)),s:T('customers').filter(c=>c.balance>0).length+' customers',tone:'bad'}],
   chart:{title:'Sales — last 7 days (GH₵)',unit:'money',data:K.lastDays(7,d=>sum(S.filter(s=>s.date===d),s=>s.total))},
   lists:[{title:'Best sellers this week',items:top},{title:'Running low',items:low.slice(0,5).map(p=>({t:p.name+' ('+storeOf(p.storeId).name+')',s:'Reorder level '+p.reorder,r:p.stock+' left'})),empty:'Stock levels look healthy.'}]
  };
 },
 smsGroups(K){return [{l:'Customers who owe money',people:()=>T('customers').filter(c=>c.balance>0).map(c=>({name:c.name,phone:c.phone}))},{l:'All customers',people:()=>T('customers').map(c=>({name:c.name,phone:c.phone}))}];},
 smsTemplates:[{l:'Credit reminder',text:'Dear {name}, kindly settle your outstanding balance at Sample Supermarket. Thank you for your custom.'},{l:'New stock',text:'Hello {name}, fresh stock has arrived at Sample Supermarket. Come and see our new prices!'}]
};

</script>
<script>
K.start(APP_CONFIG);
</script>
</body>
